name: CI

# "Lint and Test" is a required check, so it must report on every PR. PRs run
# the workflow unconditionally; the "Detect changes" step skips the work when
# nothing under LINT_TEST_PATHS changed (e.g. docs-only PRs). Keep the two
# lists in sync.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'blocks/**'
      - 'scripts/**'
      - 'styles/**'
      - 'test/**'
      - 'tools/**'
      - 'plugins/**'
      - 'workers/**'
      - 'experiments-panel/**'
      - 'helix-*.yaml'
      - '.github/workflows/ci.yml'
      - 'head.html'
      - '404.html'
      - 'eslint.config.js'
      - '.stylelintrc.json'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LINT_TEST_PATHS: '^(blocks|scripts|styles|test|tools|plugins|workers|experiments-panel)/|^helix-[^/]*\.yaml$|^\.github/workflows/ci\.yml$|^(head\.html|404\.html|eslint\.config\.js|\.stylelintrc\.json|package\.json|package-lock\.json)$'
        run: |
          if [ "$EVENT" != "pull_request" ] || ! changed="$(git diff --name-only "$BASE...$HEAD")" || echo "$changed" | grep -qE "$LINT_TEST_PATHS"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No lint/test paths changed; skipping."
          fi

      - if: github.event_name == 'pull_request'
        name: Require AK-PATCHES.md with engine changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          # Same diff range as "Detect changes"; fails closed on a git error on purpose.
          changed="$(git diff --no-renames --name-only "$BASE...$HEAD")"
          if grep -qE '^scripts/(ak|lazy|postlcp)\.js$' <<<"$changed" && ! grep -qFx 'scripts/AK-PATCHES.md' <<<"$changed"; then
            echo "::error::scripts/ak.js, scripts/lazy.js or scripts/postlcp.js changed but scripts/AK-PATCHES.md did not. Add or update the row and classification in the same PR."
            exit 1
          fi

      - if: steps.changes.outputs.run == 'true'
        name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - if: steps.changes.outputs.run == 'true'
        name: Install dependencies
        run: npm ci

      # nonce.test.js runs utils/nonce.js in real workerd (lol-html) via the
      # Miniflare pinned in workers/website; the selector is the security
      # property, so it isn't tested against a fake HTMLRewriter alone.
      # Installed before lint: eslint's import/no-unresolved must resolve it.
      - if: steps.changes.outputs.run == 'true'
        name: Install Worker dependencies (website)
        run: npm ci --prefix workers/website

      - if: steps.changes.outputs.run == 'true'
        name: Run linter
        run: npm run lint

      - if: steps.changes.outputs.run == 'true'
        name: Run ESLint rule tests
        run: npm run test:eslint-rules

      - if: steps.changes.outputs.run == 'true'
        name: Run Stylelint rule tests
        run: npm run test:stylelint-rules

      - if: steps.changes.outputs.run == 'true'
        name: Run config-sync tests
        run: npm run test:config-sync

      - if: steps.changes.outputs.run == 'true'
        name: Run tests
        run: npm test

      # Personalize End Date logic is visitor-local time. The runner is UTC, where
      # a UTC-parsed date looks correct, so re-run in a US zone (DST included).
      # personalize.test.js logs "End Date tests time zone: ..." to confirm.
      - if: steps.changes.outputs.run == 'true'
        name: Run experiment tests (TZ=America/Los_Angeles)
        env:
          TZ: America/Los_Angeles
        run: npx wtr "test/utils/experiments/*.test.js" "test/experiments-panel/*.test.js" --node-resolve --port=2001 --concurrent-browsers 4

      - if: steps.changes.outputs.run == 'true'
        name: Run Worker tests (website)
        run: node --test workers/website/test/*.test.js

      - if: steps.changes.outputs.run == 'true'
        name: Run Worker tests (decision-endpoint)
        run: node --test workers/decision-endpoint/test/*.test.js
