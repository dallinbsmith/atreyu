name: CI

on:
  pull_request:
    branches:
      - main
    paths: &lint-test-paths
      - 'blocks/**'
      - 'scripts/**'
      - 'styles/**'
      - 'test/**'
      - 'tools/**'
      - 'workers/**'
      - 'spike/**'
      - 'head.html'
      - 'eslint.config.js'
      - '.stylelintrc.json'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - main
    paths: *lint-test-paths

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run ESLint rule tests
        run: npm run test:eslint-rules

      - name: Run tests
        run: npm test
