name: CI

# "Lint and Test" is a required check, so it must report on every PR. PRs run
# the workflow unconditionally; the "Detect changes" step skips the work when
# nothing under LINT_TEST_PATHS changed (e.g. docs-only PRs). Keep the two
# lists in sync.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'blocks/**'
      - 'scripts/**'
      - 'styles/**'
      - 'test/**'
      - 'tools/**'
      - 'plugins/**'
      - 'workers/**'
      - 'experiments-panel/**'
      - 'helix-*.yaml'
      - '.github/workflows/ci.yml'
      - 'head.html'
      - 'eslint.config.js'
      - '.stylelintrc.json'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LINT_TEST_PATHS: '^(blocks|scripts|styles|test|tools|plugins|workers|experiments-panel)/|^helix-[^/]*\.yaml$|^\.github/workflows/ci\.yml$|^(head\.html|eslint\.config\.js|\.stylelintrc\.json|package\.json|package-lock\.json)$'
        run: |
          if [ "$EVENT" != "pull_request" ] || ! changed="$(git diff --name-only "$BASE...$HEAD")" || echo "$changed" | grep -qE "$LINT_TEST_PATHS"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No lint/test paths changed; skipping."
          fi

      - if: steps.changes.outputs.run == 'true'
        name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - if: steps.changes.outputs.run == 'true'
        name: Install dependencies
        run: npm ci

      - if: steps.changes.outputs.run == 'true'
        name: Run linter
        run: npm run lint

      - if: steps.changes.outputs.run == 'true'
        name: Run ESLint rule tests
        run: npm run test:eslint-rules

      - if: steps.changes.outputs.run == 'true'
        name: Run Stylelint rule tests
        run: npm run test:stylelint-rules

      - if: steps.changes.outputs.run == 'true'
        name: Run config-sync tests
        run: npm run test:config-sync

      - if: steps.changes.outputs.run == 'true'
        name: Run tests
        run: npm test

      # nonce.test.js runs utils/nonce.js in real workerd (lol-html) via the
      # Miniflare pinned in workers/website; the selector is the security
      # property, so it isn't tested against a fake HTMLRewriter alone.
      - if: steps.changes.outputs.run == 'true'
        name: Install Worker dependencies (website)
        run: npm ci --prefix workers/website

      - if: steps.changes.outputs.run == 'true'
        name: Run Worker tests (website)
        run: node --test workers/website/test/*.test.js

      - if: steps.changes.outputs.run == 'true'
        name: Run Worker tests (decision-endpoint)
        run: node --test workers/decision-endpoint/test/*.test.js
